# Values for prometheus-community/kube-prometheus-stack.
prometheus:
  prometheusSpec:
    retention: 15d
    # Pick up ServiceMonitors and rules from every namespace, not only this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  admin:
    # kubectl -n monitoring create secret generic grafana-admin \
    #   --from-literal=admin-user=admin --from-literal=admin-password='<strong password>'
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc
      access: proxy

alertmanager:
  alertmanagerSpec:
    # kubectl -n monitoring create secret generic alertmanager-slack --from-literal=url='<slack webhook>'
    secrets: ["alertmanager-slack"]
  config:
    route:
      receiver: slack
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
