apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secure-app
resources:
  - namespace.yaml
  - deployment.yaml
  - network-policy.yaml
# The pipeline replaces this with the signed image digest on every release.
images:
  - name: secure-app
    newName: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/secure-app
    newTag: initial
