apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      nodeSelector:
        workload: apps
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          env:
            # Change this message, commit and push: Argo CD rolls it out.
            - name: PODINFO_UI_MESSAGE
              value: "Deployed by Argo CD from Git"
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Calico enforces this: only pods in the same namespace may reach podinfo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-same-namespace
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
